<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zuordnungen Lern-App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/">📐 Zuordnungen Lern-App</a>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link">🏠 Menü</a>
                <a href="/theorie" class="nav-link">📖 Theorie</a>
                <a href="/quiz" class="nav-link">🎯 Quiz</a>
                <a href="/uebungen" class="nav-link">✏️ Übungen</a>
                <a href="/fortschritt" class="nav-link">📊 Fortschritt</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Zuordnungen Lern-App | Mathe Klasse 7 | Viel Erfolg! 🎓</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
